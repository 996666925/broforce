[package]
build = "build.rs"
edition = "2024"
name = "broforce"
version = "0.1.0"

[dependencies]
slint = "1.18"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.59", features = [
  "Win32_Foundation", # 「复制日志」用：OpenClipboard / SetClipboardData / GlobalAlloc
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Security",
]}

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
